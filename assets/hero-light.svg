<title id="t">Terminal running npx hello-charan</title>
<desc id="d">A terminal window. The command "npx hello-charan" is typed, then a purple boxed card appears: a small block-character robot next to boot lines ([ ok ] booting charan.exe, [ ok ] loading coffee.dll, [ ok ] mounting python3 (intermediate), [warn] social.exe: loud in text, quiet irl, [err ] 418: still a student), big block letters reading hi, i'm charan, a short bio (Charan Nihaal R, cs student; i build things, ship them, and fix them when they break), building: TrustIntern, an explainable internship-scam checker; insider at Entire :); learning: investing time in learning AI tools; status: open to internships (swe, ai/ml), remote or on-site; and links to charancodes.com, github.com/compteccharan, dev.to/noahosmont, LinkedIn and charancodes@proton.me. It ends: shutting down charan.exe... jk, still coding.</desc>
