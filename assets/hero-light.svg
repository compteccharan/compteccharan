<title id="t">charan.exe boot screen: hi, i'm charan</title>
<desc id="d">A retro terminal window types a boot log: [ ok ] booting charan.exe v2026.10; [ ok ] loading coffee.dll; [ ok ] mounting python3 (intermediate, upgrading); [ ok ] scanning offers for scam signals... done; [warn] social.exe: loud in text, quiet irl; [err ] 418: still a student. Then big pixel letters read HI, I'M CHARAN with a blinking cursor, next to a small pixel-art robot with a purple body and a smiling green screen face.</desc>
